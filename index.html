<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oracle Racing | Real-time MQTT Game</title>
    <link rel="stylesheet" href="style.css">

    <!-- On-Screen Error Logger (Debug) -->
    <script>
        window.addEventListener('error', function (event) {
            const el = document.getElementById('hof-name');
            const msg = event.message || (event.target && event.target.src ? 'Load Error: ' + event.target.src : 'Unknown Error');
            if (el) el.innerHTML = `<span style='color:red;font-size:0.75rem'>ERR: ${msg}</span>`;
            console.error("Global Error Caught:", event);
        }, true);
        window.addEventListener('unhandledrejection', function (event) {
            const el = document.getElementById('hof-name');
            if (el) el.innerHTML = `<span style='color:red;font-size:0.75rem'>PROMISE ERR: ${event.reason}</span>`;
            console.error("Unhandled Rejection Caught:", event.reason);
        });
    </script>

    <!-- MQTT.js library -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&family=Kanit:wght@400;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- 3D Background / Character Display -->
    <div id="game-canvas"></div>

    <!-- UI Overlay Layer -->
    <div id="ui-layer">

        <!-- Login / Setup Screen -->
        <div id="login-screen" class="screen">
            <div class="glass-panel">
                <h1 class="title">ORACLE <span>RACING</span></h1>
                <p>เกมแข่งวิ่งแบบ Real-time ด้วย MQTT</p>

                <div class="input-group">
                    <input type="text" id="player-name" placeholder="ตั้งชื่อตัวละครของคุณ..." maxlength="15"
                        autocomplete="off">

                    <p style="margin-top: 1rem; color: var(--primary); font-weight: bold;">เลือกร่างจำแลง (Animal
                        Avatar)</p>
                    <div class="animal-selector" id="animal-selector">
                        <div class="animal-option selected" data-animal="horse">
                            <span class="animal-emoji">🐎</span>
                            <span class="animal-label">ม้า</span>
                        </div>
                        <div class="animal-option" data-animal="flamingo">
                            <span class="animal-emoji">🦩</span>
                            <span class="animal-label">ฟลามิงโก้</span>
                        </div>
                        <div class="animal-option" data-animal="stork">
                            <span class="animal-emoji">🦢</span>
                            <span class="animal-label">นกกระสา</span>
                        </div>
                        <div class="animal-option" data-animal="parrot">
                            <span class="animal-emoji">🦜</span>
                            <span class="animal-label">นกแก้ว</span>
                        </div>
                    </div>

                    <button id="join-btn">เข้าสู่ลู่วิ่ง</button>
                </div>

                <div id="hall-of-fame-panel">
                    <h3>🏆 แชมป์เปี้ยนคนล่าสุด (Hall of Fame)</h3>
                    <div class="hof-card">
                        <span id="hof-name">กำลังตรวจสอบข้อมูล...</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Racing Screen -->
        <div id="race-screen" class="screen hidden">
            <div class="top-hud">
                <div class="instruction">กด <kbd>SPACEBAR</kbd> รัวๆ เพื่อวิ่ง!</div>
                <div id="connection-status" class="status-badge connecting">กำลังเชื่อมต่อ...</div>
            </div>

            <!-- Multiplayer Tracks (2D Minimap) -->
            <div id="tracks-container">
                <!-- Tracks will be dynamically injected here -->
            </div>

            <!-- Victory Announcer -->
            <div id="victory-modal" class="hidden glass-panel victory-panel">
                <h1 id="winner-name">YOU WIN!</h1>
                <p>ได้ถูกบันทึกลงใน Hall of Fame เรียบร้อยตั้งแต่วินาทีนี้!</p>
                <button id="restart-btn">กลับสู่ห้องเตรียมตัว</button>
            </div>
        </div>

    </div>

    <!-- Import Map for ES Modules -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.154.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.154.0/examples/jsm/"
            }
        }
    </script>

    <!-- Engine Script -->
    <script type="module" src="app.js"></script>
</body>

</html>
