<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oracle Racing | Real-time MQTT Game</title>
    <link rel="stylesheet" href="style.css">
    <!-- MQTT.js library -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&family=Kanit:wght@400;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- 3D Background / Character Display -->
    <div id="game-canvas"></div>

    <!-- UI Overlay Layer -->
    <div id="ui-layer">

        <!-- Login / Setup Screen -->
        <div id="login-screen" class="screen">
            <div class="glass-panel">
                <h1 class="title">ORACLE <span>RACING</span></h1>
                <p>เกมแข่งวิ่งแบบ Real-time ด้วย MQTT</p>

                <div class="input-group">
                    <input type="text" id="player-name" placeholder="ตั้งชื่อตัวละครของคุณ..." maxlength="15"
                        autocomplete="off">
                    <button id="join-btn">เข้าสู่ลู่วิ่ง</button>
                </div>

                <div id="hall-of-fame-panel">
                    <h3>🏆 แชมป์เปี้ยนคนล่าสุด (Hall of Fame)</h3>
                    <div class="hof-card">
                        <span id="hof-name">กำลังตรวจสอบข้อมูล...</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Racing Screen -->
        <div id="race-screen" class="screen hidden">
            <div class="top-hud">
                <div class="instruction">กด <kbd>SPACEBAR</kbd> รัวๆ เพื่อวิ่ง!</div>
                <div id="connection-status" class="status-badge connecting">กำลังเชื่อมต่อ...</div>
            </div>

            <!-- Multiplayer Tracks (2D Minimap) -->
            <div id="tracks-container">
                <!-- Tracks will be dynamically injected here -->
            </div>

            <!-- Victory Announcer -->
            <div id="victory-modal" class="hidden glass-panel victory-panel">
                <h1 id="winner-name">YOU WIN!</h1>
                <p>ได้ถูกบันทึกลงใน Hall of Fame เรียบร้อยตั้งแต่วินาทีนี้!</p>
                <button id="restart-btn">กลับสู่ห้องเตรียมตัว</button>
            </div>
        </div>

    </div>

    <!-- Engine Script -->
    <script type="module" src="app.js"></script>
</body>

</html>
